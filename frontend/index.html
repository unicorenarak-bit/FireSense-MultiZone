<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FireSense MVP</title><style>body{font-family:system-ui,sans-serif;max-width:960px;margin:30px auto;padding:0 16px;background:#f5f7fb;color:#152238}header{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border-radius:12px;padding:18px;box-shadow:0 1px 6px #0001}small{color:#667}button{background:#1467b8;color:white;border:0;border-radius:8px;padding:10px;cursor:pointer}input,select{padding:8px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere}strong{font-size:24px}</style></head><body><header><h1>🔥 FireSense Multi-Zone</h1><span>DEMO ONLY</span></header><p>ข้อมูลจาก ESP32 → FastAPI → SQLite → Dashboard · รีเฟรชทุก 2 วินาที</p><div class="grid" id="zones"></div><section class="card"><h2>ระบบน้ำจำลอง</h2><div id="water">รอข้อมูล</div></section><section class="card"><h2>อนุมัติจ่ายน้ำสี (เฉพาะโมเดลทดลอง)</h2><label>Zone <select id="zone"><option>A</option><option>B</option><option>C</option></select></label><label>เป้าหมาย <input id="ml" type="number" min="100" max="1000" value="500"> mL</label><label>Admin key <input id="key" type="password" placeholder="demo-admin-key"></label><button onclick="approve()">อนุมัติการสาธิต</button><p id="result"></p></section><section class="card"><h2>เหตุการณ์ล่าสุด</h2><pre id="events">ยังไม่มีข้อมูล</pre></section><script>const esc=x=>String(x??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');async function refresh(){try{const r=await fetch('/api/state');const d=await r.json();document.getElementById('zones').innerHTML=Object.entries(d.zones).map(([z,v])=>`<div class="card"><h2>Zone ${z}</h2><strong>${esc(v?.temperature_c)} °C</strong><p>MQ-2 raw: ${esc(v?.smoke_raw)}</p><small>${v?new Date(v.received_at*1000).toLocaleString('th-TH'):'รอข้อมูล'}</small></div>`).join('');document.getElementById('water').textContent=d.water?`Flow: ${d.water.flow_lpm} L/min · Volume: ${d.water.volume_ml} mL · Pump command: ${Boolean(d.water.pump_on)} · Valve: ${d.water.active_valve??'none'}`:'รอข้อมูล';document.getElementById('events').textContent=d.events.map(e=>`${new Date(e.created_at*1000).toLocaleTimeString('th-TH')} | ${e.zone_id} | ${e.kind} | ${e.detail}`).join('\n')||'ยังไม่มีเหตุการณ์';}catch(e){document.getElementById('result').textContent='ไม่สามารถเชื่อม Backend ได้'}}async function approve(){const r=await fetch('/api/demo/approve',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':document.getElementById('key').value},body:JSON.stringify({zone_id:document.getElementById('zone').value,target_ml:Number(document.getElementById('ml').value)})});document.getElementById('result').textContent=JSON.stringify(await r.json())}refresh();setInterval(refresh,2000);</script></body></html>
